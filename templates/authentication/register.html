<html>
    <head>
        <title>Register</title>
    </head>

    <body>
        <form action="/register" method="POST">
            <label for="username">Nome:</label>
            <input type="text" placeholder="Digite seu nome" id="username" name="username" required><br><br>

            <label for="email">Email:</label>
            <input type="email" placeholder="Digite seu email" id="email" name="email" required><br><br>

            <label for="password">Senha:</label>
            <input type="password" placeholder="Digite sua senha" id="password" name="senha" required><br><br>

            <label for="password">Confirmar Senha:</label>
            <input type="password" placeholder="Digite sua senha novamente" id="password" name="confirm_senha" required><br><br>

            <button type="submit">Cadastrar</button>
    </body>













</html>
